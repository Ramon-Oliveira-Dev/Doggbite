<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Settings -->
    <meta name="theme-color" content="#050505" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" id="apple-touch-icon" href="/icon-180.png?v=6" />
    <link rel="manifest" id="pwa-manifest" href="/manifest.json?v=6" />
    <link rel="icon" type="image/png" id="favicon" href="/icon-192.png?v=6" />
    
    <title>DOGGBITE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register Service Worker & Error Guards -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.message === 'Script error.') {
          // Suppress generic cross-origin script error noise from iframe/sandbox environment
          e.preventDefault && e.preventDefault();
        }
      });

      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          try {
            navigator.serviceWorker.register('/sw.js')
              .then(function(reg) {
                console.log('DOGGBITE PWA Service Worker registered with scope: ', reg.scope);
              })
              .catch(function(err) {
                console.warn('DOGGBITE PWA Service Worker registration skipped/failed: ', err);
              });
          } catch (e) {
            console.warn('Service Worker registration not supported in current environment context:', e);
          }
        });
      }
    </script>
  </body>
</html>
